<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>{{ tieu_de }} - Quản lý Quý Thu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div class="bg-dark text-white py-3 mb-4 shadow-sm">
        <div class="container">
            <h4 class="m-0 fw-bold">⚙️ HỆ THỐNG QUẢN LÝ QUÝ THU</h4>
        </div>
    </div>

    <div class="container py-3">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 p-4">
                    <h3 class="fw-bold text-success mb-3">{{ tieu_de }}</h3>
                    <hr>

                    <form method="POST">
                        {% csrf_token %}

                        <!-- Lặp qua từng ô nhập liệu trong form -->
                        {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                            {% endif %}
                        </div>
                        {% endfor %}

                        <div class="d-flex justify-content-between mt-4">
                            <!-- Nút Hủy thao tác theo Luồng A4: Quay về danh sách quản lý -->
                            <a href="{% url 'products:quan_ly' %}" class="btn btn-secondary">
                                ❌ Hủy thao tác
                            </a>

                            <!-- Nút Lưu (Bước 6) -->
                            <button type="submit" class="btn btn-success fw-bold px-4">
                                💾 Lưu sản phẩm
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
