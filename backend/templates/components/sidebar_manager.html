
{% load static %}

<aside class="sidebar" id="sidebar">

    <div class="sidebar-brand">
        <div class="brand-logo"><img src="{% static 'images/logo-removebg-preview.webp' %}" alt="Logo Quý Thu"></div>
        <div class="brand-info">
            <h5>QUÝ THU</h5>
            <span>Quản trị cửa hàng</span>
        </div>
    </div>

    <div class="sidebar-user">
        <div class="user-avatar">
            {{ request.user.email|first|upper }}
        </div>

        <div class="user-info">
            <strong>{{ request.user.email }}</strong>
            <span>Quản lý</span>
        </div>
    </div>

    <nav class="sidebar-nav">

        <div class="nav-section-title">ĐIỀU HÀNH</div>

        <a href="{% url 'manager-dashboard' %}" class="nav-link-custom">
            <span class="nav-icon">⌂</span>
            <span>Tổng quan</span>
        </a>

        <div class="nav-section-title">QUẢN LÝ HỆ THỐNG</div>

        <a href="{% url 'employee-customer-list' %}" class="nav-link-custom">
            <span class="nav-icon">♙</span>
            <span>Khách hàng</span>
        </a>

        <a href="{% url 'manager-role-permissions' %}" class="nav-link-custom">
            <span class="nav-icon">♙</span>
            <span>Quản lý nhân sự</span>
        </a>

        <a href="{% url 'order-list' %}" class="nav-link-custom">
            <span class="nav-icon">▤</span>
            <span>Đơn hàng</span>
        </a>

        <a href="{% url 'products:quan_ly' %}" class="nav-link-custom">
            <span class="nav-icon">▣</span>
            <span>Sản phẩm</span>
        </a>

        <div class="nav-section-title">KINH DOANH</div>

        <a href="{% url 'reports:dashboard' %}" class="nav-link-custom">
            <span class="nav-icon">▥</span>
            <span>Báo cáo tổng quan</span>
        </a>

        <a href="{% url 'reports:detail' %}" class="nav-link-custom">
            <span class="nav-icon">◷</span>
            <span>Báo cáo chi tiết</span>
        </a>

        <a href="{% url 'manager-after-sales' %}" class="nav-link-custom">
            <span class="nav-icon">↩</span>
            <span>Hậu mãi</span>
        </a>

    </nav>

    <div class="sidebar-bottom">
        <form method="post" action="{% url 'dang-xuat-giao-dien' %}">
            {% csrf_token %}
            <button type="submit" class="logout-button">
                <span>↪</span> Đăng xuất
            </button>
        </form>
    </div>

</aside>
