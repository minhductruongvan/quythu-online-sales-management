{% extends "base.html" %}
{% load static %}
{% block title %}Sửa danh mục | Quý Thu{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/modules.css' %}">{% endblock %}
{% block content %}
<main class="module-page">
    <header class="module-heading"><div><span class="module-eyebrow">SẢN PHẨM</span><h1>Sửa {{ danh_muc.ten_dm }}</h1></div><a class="module-link-button secondary" href="{% url 'products:quan_ly_danh_muc' %}">← Danh mục</a></header>
    <section class="module-panel"><form method="post">{% csrf_token %}{{ form.as_p }}<button class="module-button" type="submit">Lưu thay đổi</button></form></section>
</main>
{% endblock %}
